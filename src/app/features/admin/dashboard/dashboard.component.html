<section class="dashboard-shell">
  <header class="dashboard-header">
    <div>
      <p class="eyebrow">Dashboard</p>
      <h1>Admin shortcuts</h1>
      <p class="description">Jump into the areas that are available today. No fabricated stats, just navigation.</p>
    </div>
  </header>

  <div class="card-grid">
    @for (card of cards; track card.link) {
      <a class="card" [routerLink]="card.link">
        <h2>{{ card.title }}</h2>
        <p>{{ card.description }}</p>
      </a>
    }
  </div>
</section>
